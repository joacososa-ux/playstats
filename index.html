<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlayStats</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PlayStats">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a12;--panel:#1a1522;--panel2:#241c2e;--line:#3a2d48;--tx:#f1ebf7;--mut:#9b8bad;--acc:#c6ff3d;--acc-tx:#101400;--bad:#ff5d73;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(120% 60% at 50% -10%,#2a1a3a 0%,var(--bg) 60%) fixed;color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh}
body.fifa{--acc:#2ee67a;--acc-tx:#04180c;--panel:#10201a;--panel2:#183027;--line:#255240;--bg:#07120d;--mut:#8fb5a2}
body.brawl{--acc:#ff8a2b;--acc-tx:#1c0c00;--panel:#241612;--panel2:#33201a;--line:#5a3426;--bg:#120a08;--mut:#c0a090}
body.fifa{background:radial-gradient(120% 60% at 50% -10%,#14402c 0%,var(--bg) 60%) fixed}
body.brawl{background:radial-gradient(120% 60% at 50% -10%,#4a2210 0%,var(--bg) 60%) fixed}
body.cr{--acc:#5aa9ff;--acc-tx:#04122b;--panel:#101a36;--panel2:#18264a;--line:#2b4382;--bg:#080e22;--mut:#9fb3de}
body.cr{background:radial-gradient(120% 60% at 50% -10%,#1d3f9e 0%,var(--bg) 60%) fixed}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3,.disp{font-family:'Rajdhani','Arial Narrow',sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
.logo{font-size:44px;line-height:1;margin:20px 0 4px}
.logo b{color:var(--acc)}
.sub{color:var(--mut);margin:0 0 24px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top h2{font-size:30px;flex:1}
button,select,input{font:inherit;color:inherit}
input,select{font-size:16px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 14px;min-height:40px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:var(--acc-tx);border-color:var(--acc);font-weight:700}
.ghost{background:transparent}
.danger{color:var(--bad)}
.big{display:block;width:100%;text-align:left;border-radius:18px;padding:22px 20px;margin-bottom:14px;border:1px solid;min-height:120px;position:relative;overflow:hidden}
.big .disp{font-size:38px;display:block}
.big small{display:block;margin-top:4px;opacity:.8}
.big .em{position:absolute;right:14px;top:10px;font-size:64px;opacity:.9}
.b-fifa{background:linear-gradient(135deg,#0f3d27,#15683f);border-color:#2ee67a}
.b-brawl{background:linear-gradient(135deg,#4a1f0c,#9a4412);border-color:#ff8a2b}
.b-cr{background:linear-gradient(135deg,#14275c,#2a4fb8);border-color:#5aa9ff}
.b-cr .disp{font-size:32px;padding-right:70px}
.strip{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:2px;padding:14px 16px;border-radius:18px;border:1px solid var(--gold);background:radial-gradient(100% 140% at 0% 0%,rgba(255,210,74,.22),transparent 65%),var(--panel);box-shadow:0 0 26px -8px rgba(255,210,74,.6)}
.strip .crn{font-size:40px;line-height:1;animation:flo 3s ease-in-out infinite}
.strip .stx{flex:1;display:flex;flex-direction:column;min-width:0}
.strip small{color:var(--gold);font-weight:700;font-size:13px}
.strip b{font-family:'Rajdhani','Arial Narrow',sans-serif;font-size:32px;line-height:1.05;color:#fff3c4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip em{font-style:normal;color:var(--mut);font-size:13px;margin-top:2px}
@media (prefers-reduced-motion:reduce){.strip .crn{animation:none}}
.vstrip{margin-top:12px;border-color:var(--line);background:radial-gradient(100% 140% at 0% 0%,rgba(90,169,255,.18),transparent 65%),var(--panel);box-shadow:0 0 26px -10px rgba(90,169,255,.6)}
.vstrip small{color:var(--acc)}
.vstrip b{font-size:28px}
.vsw{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:4px 16px 14px;margin:0 -16px;scrollbar-width:none}
.vsw::-webkit-scrollbar{display:none}
.vcab{flex:0 0 90%;scroll-snap-align:center;position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#1a1d24,#0c0d11 55%,#14161c);border:1px solid #2c303b;box-shadow:0 18px 34px -14px #000,inset 0 0 0 4px #0a0b0e,inset 0 0 0 5px #343947}
.vcab::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 4px);pointer-events:none}
.vcab::after{content:"";position:absolute;inset:0;background:linear-gradient(112deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 22%,transparent 38%,transparent 64%,rgba(255,255,255,.05) 78%,transparent 90%);pointer-events:none;z-index:5}
.vled{height:5px;margin:6px 6px 0;border-radius:99px;background:linear-gradient(90deg,transparent,var(--led) 18%,var(--led) 82%,transparent);box-shadow:0 0 14px var(--led),0 8px 26px -2px var(--led);position:relative;z-index:2}
.vhd{display:flex;align-items:center;gap:6px;padding:10px 10px 6px;position:relative;z-index:3}
.vtt{flex:1;min-width:0;text-align:center;background:linear-gradient(180deg,#3a3f4b,#262a33);border:1px solid #4a505e;border-radius:10px;padding:5px 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.5)}
.vtt b{display:block;font-size:26px;line-height:1.05;color:#f3f4f8;letter-spacing:.04em;text-shadow:0 1px 0 #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtt b small{font-size:13px;color:var(--led)}
.vtt span{display:block;font-size:12px;color:#aab0bf}
.vnav{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;background:#1d2027;border:1px solid #3a3f4b;font-size:20px;line-height:1;color:var(--led);flex:none}
.vwall{position:relative;margin:4px 8px 0;padding:14px 4px 0;background:radial-gradient(90% 90% at 50% 0%,color-mix(in srgb,var(--led) 20%,transparent),transparent 70%),linear-gradient(#0d0e12,#08090c);border-radius:8px 8px 0 0;box-shadow:inset 0 10px 22px -8px #000;z-index:1}
.vrow{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:6px 8px 0;min-height:216px;scrollbar-width:none}
.vrow::-webkit-scrollbar{display:none}
.vtr{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;border:0;background:transparent;padding:0 2px;min-height:0;max-width:104px}
.vtr img{height:128px;width:auto;display:block;position:relative;z-index:1;-webkit-box-reflect:below 1px linear-gradient(transparent 70%,rgba(255,255,255,.16));filter:drop-shadow(0 6px 5px rgba(0,0,0,.6))}
.vglow{position:absolute;left:-14px;right:-14px;top:-6px;height:140px;z-index:0;pointer-events:none}
.vpl{position:relative;z-index:2;margin-top:6px;width:96px;border-radius:5px;padding:3px 5px;background:linear-gradient(180deg,#ffe58a,#d9a21b 55%,#f6cf5a);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 4px rgba(0,0,0,.6);color:#3a2700;font-size:10.5px;font-weight:700;line-height:1.15;text-align:center}
.vpl i{font-style:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.vdt{position:relative;z-index:2;font-size:10px;color:#9aa1b2;margin:3px 0 4px;white-space:nowrap}
.vempty{flex:1;text-align:center;color:#7d8394;padding:50px 0 34px;font-size:15px}
.vempty small{display:block;font-size:12px;margin-top:4px;opacity:.8}
.vshelf{height:14px;margin:0 -4px;background:linear-gradient(180deg,rgba(210,235,255,.55),rgba(120,160,190,.25) 45%,rgba(20,28,36,.9));border-top:1px solid rgba(255,255,255,.55);box-shadow:0 10px 18px -6px color-mix(in srgb,var(--led) 55%,#000);position:relative;z-index:3}
.vfoot{height:16px;margin-top:2px;background:linear-gradient(180deg,#1a1d24,#0a0b0e)}
.vd{display:flex;justify-content:center;gap:7px;margin:-2px 0 6px}
.vd i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .2s}
.vd i.on{width:20px;border-radius:99px;background:var(--acc)}
.vsheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;box-shadow:0 -20px 50px -10px #000;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.vsheet{animation:none}}
.hbar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 0}
.mbtn{position:relative;width:48px;height:48px;border-radius:14px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--panel2)}
.mbtn svg{width:24px;height:24px}
.mdot{position:absolute;top:7px;right:7px;width:12px;height:12px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.mnu{position:fixed;z-index:41;top:calc(env(safe-area-inset-top,0px) + 80px);right:max(12px,calc((100vw - 640px)/2 + 12px));width:min(330px,calc(100vw - 24px));max-height:calc(100vh - 110px - env(safe-area-inset-top,0px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 20px 50px -10px #000;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.97)}}
.mhd{display:flex;align-items:center;gap:12px;padding:4px 4px 8px}
.msec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:12px 6px 4px}
.mit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;border-radius:12px;min-height:50px;padding:8px 10px;font-size:16px}
.mit:active,.mit:hover{background:var(--panel2)}
.mie{font-size:22px;width:28px;text-align:center}.mil{flex:1}.mic{color:var(--mut)}
.mbd{background:var(--bad);color:#2a0007;font-weight:700;border-radius:99px;padding:2px 9px;font-size:13px}
@media (prefers-reduced-motion:reduce){.mnu{animation:none}}
.av{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#fff3c4);color:var(--acc-tx);display:flex;align-items:center;justify-content:center;font-family:'Rajdhani','Arial Narrow',sans-serif;font-size:34px;font-weight:700;flex:none}
.tchip{display:inline-block;font-weight:700;font-size:13px;border-radius:99px;padding:5px 11px;margin:3px 4px 0 0}
.tchip.oro{background:linear-gradient(135deg,#fff0a0,#ffc933 55%,#e0a100);color:#3a2a00;font-size:14.5px;box-shadow:0 0 14px rgba(255,201,51,.6)}
.tchip.pos{background:linear-gradient(135deg,#b9f6ca,#3ddc84);color:#04210f}
.tchip.neu{background:linear-gradient(135deg,#d7e6ff,#8fb2f5);color:#0b1d40}
.tchip.neg{background:linear-gradient(135deg,#ffb3bf,#ff5d73);color:#3b0510}
.tcd.oro{box-shadow:0 0 22px -4px rgba(255,201,51,.65);background:radial-gradient(100% 120% at 0% 0%,rgba(255,201,51,.16),transparent 60%),var(--panel)}
.tcd.vac{opacity:.55}
.cab{border:10px solid #6b4423;border-radius:14px;background:#0f0b08;box-shadow:inset 0 0 0 2px #3d2512,0 14px 30px -10px #000;position:relative;overflow:hidden}
.cab::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.09) 0%,transparent 28%,transparent 62%,rgba(255,255,255,.06) 100%);pointer-events:none}
.cabh{background:linear-gradient(#7b4f25,#5b3a1c);color:#ffe9b0;text-align:center;padding:9px 8px;font-family:'Rajdhani','Arial Narrow',sans-serif;font-size:19px;font-weight:700}
.shelf{padding:10px 8px 0;border-bottom:8px solid #7b4f25;box-shadow:0 10px 12px -8px rgba(0,0,0,.7);background:radial-gradient(90% 100% at 50% 0%,rgba(255,225,150,.10),transparent 70%)}
.shl{font-family:'Rajdhani','Arial Narrow',sans-serif;font-weight:700;font-size:16px;margin-bottom:4px}.shl span{color:var(--mut);font-weight:500;font-size:13px;margin-left:6px}
.trs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tr{text-align:center;padding:2px 2px 10px}
.tr svg{width:62px;height:72px;filter:drop-shadow(0 5px 4px rgba(0,0,0,.6))}
.trn{font-size:12px;font-weight:700;line-height:1.15;word-break:break-word}
.trd{font-size:11px;color:var(--mut);margin-top:2px}
.trempty{color:var(--mut);font-size:13px;text-align:center;padding:16px 0 20px}
.ld{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ld img{width:112px;height:112px;border-radius:26px;box-shadow:0 14px 44px -8px rgba(198,255,61,.45),0 0 0 1px rgba(255,255,255,.08);animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px) rotate(-3deg)}}
.ldbar{width:150px;height:5px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.ldbar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:var(--acc);border-radius:99px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.ldp{position:relative;height:22px;width:100%;margin-top:16px;color:var(--mut);font-size:14px}
.ldp span{position:absolute;left:0;right:0;opacity:0;animation:ph 8s infinite}
.ldp span:nth-child(2){animation-delay:2s}.ldp span:nth-child(3){animation-delay:4s}.ldp span:nth-child(4){animation-delay:6s}
@keyframes ph{0%{opacity:0}4%,22%{opacity:1}26%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ld img,.ldbar::after,.ldp span{animation:none}.ldp span:first-child{opacity:1}}
.rob{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--mut)}
body.ro .ctl button,body.ro .add,body.ro td .ghost,body.ro .tabs button[onclick*="'new'"],body.ro button[onclick^="finishT"],body.ro button[onclick^="finishCup"],body.ro button[onclick^="go({cd"],body.ro button[onclick^="delT2"],body.ro button[onclick^="delFriend"],body.ro select[onchange^="linkFriend"],body.ro .card:has(#cc),body.ro .card:has(button[onclick^="addMember"]){display:none!important}
body.ro .match input,body.ro .bp select,body.ro .bp input,body.ro .stp{pointer-events:none;opacity:.5}
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#1f1f26;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
.row2{display:flex;gap:10px}
.row2 button{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--panel);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mut);padding-left:6px;padding-right:6px}
.tabs button.on{background:var(--acc);color:var(--acc-tx);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
.add{display:flex;gap:8px;margin-bottom:12px}
.add .in{flex:1}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:420px}
th{font-family:'Rajdhani',sans-serif;font-size:15px;color:var(--mut);text-align:center;padding:8px 4px;font-weight:600}
th:first-child,td:first-child{text-align:left;padding-left:14px}
td{padding:8px 4px;border-top:1px solid var(--line);text-align:center}
td:first-child{font-weight:700}
.ctl{display:inline-flex;align-items:center;gap:6px}
.ctl button{width:30px;height:30px;min-height:0;padding:0;border-radius:8px}
.ctl span{min-width:22px;font-weight:700;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:transparent;padding:0 6px;min-height:0;color:var(--mut)}
.match{display:grid;grid-template-columns:1fr 46px 12px 46px 1fr;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.match .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .n:last-child{text-align:right}
.match input{width:100%;text-align:center;padding:8px 0;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.match.done .n.w{color:var(--acc);font-weight:700}
.rd{font-family:'Rajdhani',sans-serif;color:var(--acc);font-size:18px;margin:14px 0 2px}
.empty{color:var(--mut);text-align:center;padding:22px 8px}
.t-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;margin-bottom:8px;padding:14px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--mut)}
.tag.ok{background:var(--acc);color:var(--acc-tx);font-weight:700}
.champ{background:var(--acc);color:var(--acc-tx);border-radius:14px;padding:14px;margin-bottom:12px;font-weight:700}
.note{color:var(--mut);font-size:13px;margin:8px 0}
:root{--gold:#ffd24a}
.throne{text-align:center;padding:22px 16px 18px;margin:4px 0 16px;border-radius:20px;border:1px solid var(--gold);background:radial-gradient(90% 120% at 50% 0%,rgba(255,210,74,.3),rgba(255,210,74,.04) 70%),var(--panel);box-shadow:0 0 0 1px rgba(255,210,74,.25),0 10px 40px -10px rgba(255,210,74,.55)}
.throne .cr{font-size:46px;line-height:1;animation:flo 3s ease-in-out infinite}
.throne .tl{color:var(--gold);font-weight:700;margin-top:6px}
.throne .tn{font-family:'Rajdhani','Arial Narrow',sans-serif;font-size:clamp(40px,13vw,66px);line-height:1;font-weight:700;color:#fff3c4;text-shadow:0 0 24px rgba(255,210,74,.6);overflow-wrap:anywhere}
.throne .ts{color:var(--mut);margin-top:8px}
@keyframes flo{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.throne .cr{animation:none}}
tr.top1 td{background:#3d3516;background:color-mix(in srgb,var(--gold) 24%,var(--panel));color:#fff3c4;font-size:1.1em;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
tr.top1 td:first-child{border-left:1px solid var(--gold);border-radius:12px 0 0 12px}
tr.top1 td:last-child{border-right:1px solid var(--gold);border-radius:0 12px 12px 0}
.rk{display:inline-block;width:30px;color:var(--mut);font-weight:500;font-size:13px}
.crown{display:inline-block;width:30px;font-size:1.05em;vertical-align:middle}
.st{min-width:0}
.st th,.st td{padding-left:3px;padding-right:3px}
.st th:first-child,.st td:first-child{padding-left:12px}
.st th{font-size:14px}
.bal{display:block;white-space:nowrap;margin-left:30px;color:var(--mut);font-size:11px;font-weight:400;line-height:1.3}
.zocalo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--bad);color:#2a0007;border-radius:12px;border-left:8px solid #7a0016;padding:10px 14px;margin:0 0 12px}
.zocalo b{font-family:'Rajdhani','Arial Narrow',sans-serif;font-size:28px;line-height:1}
.zocalo .zt{font-weight:700;background:#2a0007;color:#ffd0d6;border-radius:6px;padding:2px 8px;font-size:13px}
tr.last td{background:#3d1a22;background:color-mix(in srgb,var(--bad) 26%,var(--panel));color:#ffc2cb;border-top:1px solid var(--bad);border-bottom:1px solid var(--bad)}
tr.last td:first-child{border-left:1px solid var(--bad);border-radius:12px 0 0 12px}
tr.last td:last-child{border-right:1px solid var(--bad);border-radius:0 12px 12px 0}
.bm{border-top:1px solid var(--line);padding:8px 0}.bp{display:grid;grid-template-columns:1fr 86px 122px;gap:8px;align-items:center;padding:4px 0}.bp .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bp select{padding:6px 8px}.ko{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}.ko input{width:52px;text-align:center;padding:8px 0;background:var(--bg);border:1px solid var(--line);border-radius:8px}.bm.done .bp .n{color:var(--acc)}
.ko{gap:8px}.kv{min-width:20px;text-align:center;font-size:20px;color:var(--tx);font-family:'Rajdhani','Arial Narrow',sans-serif}
.stp{display:inline-flex;flex-direction:column;gap:3px}
.stp button{width:36px;height:24px;min-height:0;padding:0;font-size:11px;line-height:1;border-radius:7px}
.stp button:disabled{opacity:.4}.warn{color:var(--bad);font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const GAMES={fifa:{n:'FIFA',e:'⚽',u:'Goles'},brawl:{n:'BrawlHalla',e:'⚔️',u:'Puntos'},cr:{n:'Clash Royale',e:'🏰',u:'Coronas'}};
const blank=()=>({friends:[],games:{fifa:{players:[],tours:[],stats:{}},brawl:{players:[],tours:[],stats:{}},cr:{players:[],tours:[],stats:{}}}});
let R={groups:[],cur:null};
const nid=()=>Math.random().toString(36).slice(2,9);
function migrate(r){if(r&&r.groups&&r.groups.length)return r;const g={id:nid(),name:'Mi grupo',...blank()};if(r&&r.games){g.friends=r.friends||[];g.games=r.games}return{groups:[g],cur:g.id}}
let S=null;function setS(){S=R.groups.find(g=>g.id===R.cur)||R.groups[0]||null;if(S)R.cur=S.id}
let USER=null,authChecked=false,ready=false,loginErr='',subs={},tms={};
const APP_V='5-nov-2026 · h';
const isAdminOf=g=>!!(g&&USER&&(g.owner===USER.uid||(g.admins||[]).includes(USER.uid)));
const canEdit=()=>isAdminOf(S);
let toastT=null;
function toast(m){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=m;e.className='show';clearTimeout(toastT);toastT=setTimeout(()=>{e.className=''},3000)}
async function toggleAdmin(gid,u){const g=R.groups.find(x=>x.id===gid);if(!g||g.owner!==USER.uid)return;v.err='';v.msg='';
  const cur=g.admins||[];const nx=cur.includes(u)?cur.filter(x=>x!==u):[...cur,u];
  try{await FB.setAdmins(gid,nx);g.admins=nx;v.msg='Listo: '+(nx.includes(u)?'@'+memberNick(u)+' ahora es administrador.':'@'+memberNick(u)+' ya no es administrador.')}catch(e){v.err='No se pudo cambiar el rol: '+(e.code||e.message)}render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&v.menu)go({menu:false})});
let INST=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INST=e;if(typeof softRender==='function'&&v.s==='home')softRender()});
window.addEventListener('appinstalled',()=>{INST=null;render()});
function installApp(){if(!INST)return;v.menu=false;INST.prompt();INST.userChoice.finally(()=>{INST=null;render()})}
let ME=null,PROF={},FR=[],INV=[],socUnsub=[];
function startSocial(){if(socUnsub.length||!USER||!ME)return;
  socUnsub.push(FB.watchFr(USER.uid,l=>{FR=l;loadProfiles().then(softRender).catch(()=>softRender())}));
  socUnsub.push(FB.watchInv(USER.uid,l=>{INV=l;softRender()}))}
function stopSocial(){socUnsub.forEach(f=>f());socUnsub=[];FR=[];INV=[]}
const frOf=u=>FR.find(f=>f.users.includes(u));
const badge=()=>USER?FR.filter(f=>f.status==='pending'&&f.to===USER.uid).length+INV.length:0;
async function searchNick(){const raw=$('sq').value.trim().replace(/^@/,'').toLowerCase();v.err='';v.msg='';v.found=null;
  if(!raw){render();return}
  if(raw===ME.nickLower){v.err='Ese sos vos 😄';render();return}
  try{const u=await FB.nickUid(raw);if(!u){v.err='No existe ningún usuario con ese nick.';render();return}
    const p=await FB.getProfile(u);if(p)PROF[u]=p;v.found=u;render()}catch(e){v.err='No se pudo buscar: '+(e.code||e.message);render()}}
async function sendReq(u){try{await FB.sendReq(USER.uid,u);v.found=null;v.msg='Solicitud enviada a @'+memberNick(u)+'.'}catch(e){v.err='No se pudo enviar la solicitud: '+(e.code||e.message)}render()}
async function frAct(op,id){try{if(op==='ok')await FB.acceptReq(id);else await FB.delReq(id)}catch(e){v.err='No se pudo completar: '+(e.code||e.message);render()}}
async function invUser(u){v.err='';v.msg='';
  try{await FB.sendInvite(S.id,S.name,USER.uid,ME.nick,u);v.msg='Invitación a "'+S.name+'" enviada a @'+memberNick(u)+'.'}catch(e){v.err='No se pudo invitar. Quizás ya le mandaste la invitación.'}render()}
async function enterGroup(gid){const d=await FB.getGroup(gid);if(!d)throw new Error('x');const g=fromDoc(d);R.groups.push(g);R.cur=gid;setS();normalize();await loadProfiles();watch(g);saveUser();go({s:'home',g:null})}
async function invAct(op,id){const inv=INV.find(i=>i.id===id);if(!inv)return;
  try{if(op==='ok'&&!R.groups.some(g=>g.id===inv.gid)){await FB.joinGroup(inv.gid,USER.uid);await FB.delInvite(id);await enterGroup(inv.gid)}else await FB.delInvite(id)}
  catch(e){v.err='No se pudo aceptar la invitación (quizás el grupo ya no existe).';render()}}
function social(){const me=USER.uid;
  const inc=FR.filter(f=>f.status==='pending'&&f.to===me),out=FR.filter(f=>f.status==='pending'&&f.from===me),ok=FR.filter(f=>f.status==='accepted');
  const o=f=>f.users.find(u=>u!==me),nk=u=>esc('@'+memberNick(u));
  const row=(l,r)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap"><b>${l}</b><span style="display:flex;gap:6px;flex-wrap:wrap">${r}</span></div>`;
  const fu=v.found,fr=fu?frOf(fu):null;
  return `<div class="top"><button class="ghost" onclick="go({s:'home',err:'',msg:'',found:null})">←</button><h2>Amigos</h2></div>
${v.err?`<p class="warn" style="margin-bottom:10px">${esc(v.err)}</p>`:''}${v.msg?`<p class="note" style="color:var(--acc)">${esc(v.msg)}</p>`:''}
<div class="add"><input class="in" id="sq" placeholder="Buscar por nick (ej. virg0)" autocapitalize="off" autocomplete="off" onkeydown="if(event.key==='Enter')searchNick()"><button class="pri" onclick="searchNick()">Buscar</button></div>
${fu?`<div class="card">${row('@'+esc(memberNick(fu)),!fr?`<button class="pri" onclick="sendReq('${fu}')">Enviar solicitud</button>`:fr.status==='accepted'?'<span class="tag ok">Ya son amigos</span>':fr.to===me?`<button class="pri" onclick="frAct('ok','${fr.id}')">Aceptar solicitud</button>`:'<span class="tag">Solicitud enviada</span>')}</div>`:''}
${INV.length?`<div class="card"><h3>Invitaciones a grupos</h3>${INV.map(i=>row(esc(i.gname)+' <small style="color:var(--mut);font-weight:400">de @'+esc(i.fromNick)+'</small>',`<button class="pri" onclick="invAct('ok','${i.id}')">Unirme</button><button class="ghost danger" onclick="invAct('no','${i.id}')">Rechazar</button>`)).join('')}</div>`:''}
${inc.length?`<div class="card"><h3>Solicitudes de amistad</h3>${inc.map(f=>row(nk(o(f)),`<button class="pri" onclick="frAct('ok','${f.id}')">Aceptar</button><button class="ghost danger" onclick="frAct('no','${f.id}')">Rechazar</button>`)).join('')}</div>`:''}
<div class="card"><h3>Mis amigos</h3>${ok.length?ok.map(f=>{const u=o(f);return row(nk(u),(S.members.includes(u)?`<span class="tag">En ${esc(S.name)}</span>`:`<button onclick="invUser('${u}')">Invitar a ${esc(S.name)}</button>`)+`<button class="ghost danger" onclick="frAct('no','${f.id}')">Quitar</button>`)}).join(''):'<div class="empty" style="padding:10px">Todavía no tenés amigos. Buscá a alguien por su nick.</div>'}</div>
${out.length?`<div class="card"><h3>Solicitudes enviadas</h3>${out.map(f=>row(nk(o(f)),`<button class="ghost" onclick="frAct('no','${f.id}')">Cancelar</button>`)).join('')}</div>`:''}`}
const memberNick=u=>(PROF[u]&&PROF[u].nick)||'usuario';
async function loadProfiles(){const ids=[...new Set([...R.groups.flatMap(g=>g.members||[]),...FR.flatMap(f=>f.users)])].filter(id=>!PROF[id]);
  const out=await Promise.all(ids.map(id=>FB.getProfile(id).catch(()=>null)));ids.forEach((id,i)=>{if(out[i])PROF[id]=out[i]})}
async function saveNick(){const raw=$('nk').value.trim();v.nickErr='';
  if(!/^[A-Za-z0-9_]{3,16}$/.test(raw)){v.nickErr='Usá de 3 a 16 caracteres: letras, números o guión bajo.';render();return}
  const nl=raw.toLowerCase();
  try{if(!(ME&&ME.nickLower===nl)&&!(await FB.nickFree(nl))){v.nickErr='Ese nick ya está en uso. Probá con otro.';render();return}
    await FB.setNick(USER.uid,raw,ME?ME.nickLower:null);
    ME={nick:raw,nickLower:nl};PROF[USER.uid]=ME;startSocial();go({s:'home'})
  }catch(e){v.nickErr='No se pudo guardar el nick: '+(e.code||e.message);render()}}
function nickView(){return `<h1 class="logo disp">Elegí tu <b>nick</b></h1><p class="sub">Es el nombre con el que te van a ver tus amigos en PlayStats. Tiene que ser único.</p>${v.nickErr?`<p class="warn" style="margin-bottom:10px">${esc(v.nickErr)}</p>`:''}<input class="in" id="nk" placeholder="ej. virg0" maxlength="16" autocapitalize="off" autocomplete="off" onkeydown="if(event.key==='Enter')saveNick()"><button class="pri" style="width:100%;margin-top:12px;min-height:50px" onclick="saveNick()">Guardar nick</button><p class="note">3 a 16 caracteres: letras, números o guión bajo.</p>`}
function backupFile(){
  const data={app:'PlayStats',v:1,exportedAt:new Date().toISOString(),by:ME?ME.nick:'',groups:R.groups.map(g=>({id:g.id,name:g.name,friends:g.friends,games:g.games}))};
  return new File([JSON.stringify(data,null,1)],'playstats-copia-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'})}
function dlBackup(quiet){const f=backupFile();const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);if(!quiet){v.bmsg='Copia descargada: '+f.name;render()}}
function canShareFiles(){try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'a.json',{type:'application/json'})]}))}catch(e){return false}}
async function shareBackup(){const f=backupFile();try{await navigator.share({files:[f],title:'Copia de PlayStats'});v.bmsg='Copia lista.';render()}catch(e){if(!e||e.name!=='AbortError'){v.bmsg='No se pudo compartir. Probá con "Descargar copia".';render()}}}
function pickBackup(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);
      if(!d||d.app!=='PlayStats'||!Array.isArray(d.groups)||!d.groups.length)throw 0;
      d.groups.forEach(g=>{if(!g||!Array.isArray(g.friends)||!g.games||!g.games.fifa||!g.games.brawl||!Array.isArray(g.games.fifa.tours)||!Array.isArray(g.games.brawl.tours))throw 0});
      v.bk=d;v.bmsg='';v.rc=null}catch(e){v.bk=null;v.bmsg='Ese archivo no es una copia válida de PlayStats.'}render()};
  rd.readAsText(f)}
async function restoreNew(i){const g=v.bk.groups[i];
  try{const n=R.groups.some(x=>x.name===g.name)?g.name+' (restaurado)':g.name;
    const ng=await createG(n,{friends:g.friends,games:g.games});normalize();R.cur=ng.id;setS();watch(ng);saveUser();
    v.bk=null;v.rc=null;v.bmsg='Listo: "'+ng.name+'" se restauró como grupo nuevo.'}catch(e){v.bmsg='No se pudo restaurar: '+(e.code||e.message)}render()}
function restoreReplace(i){const b=v.bk.groups[i];const g=R.groups.find(x=>x.id===b.id);if(!g)return;if(!isAdminOf(g)){v.bmsg='Solo un administrador puede reemplazar los datos de este grupo.';v.rc=null;render();return}
  dlBackup(true);g.friends=b.friends;g.games=b.games;normalize();saveG(g);
  v.bk=null;v.rc=null;v.bmsg='Listo: se reemplazaron los datos de "'+g.name+'". Además se descargó una copia de cómo estaba antes.';render()}
function backupCard(){const bk=v.bk;
  return `<div class="card" style="margin-top:14px"><h3>Copia de seguridad</h3>
<p class="note">Guardá un archivo con todos tus grupos, torneos y tablas. Conviene hacerlo antes de cada actualización grande.</p>
<div class="row2" style="flex-wrap:wrap"><button class="pri" onclick="dlBackup()">Descargar copia</button>${canShareFiles()?'<button onclick="shareBackup()">Compartir / guardar en…</button>':''}</div>
${v.bmsg?`<p class="note" style="color:var(--acc)">${esc(v.bmsg)}</p>`:''}
<p class="note" style="margin-top:16px">Restaurar desde una copia (elegí el archivo .json):</p>
<input class="in" type="file" accept=".json,application/json" onchange="pickBackup(this)">
${bk?`<p class="note">Copia del ${esc(bk.exportedAt?new Date(bk.exportedAt).toLocaleDateString('es-AR'):'?')}${bk.by?' · de @'+esc(bk.by):''}</p>`+bk.groups.map((g,i)=>{const ex=R.groups.find(x=>x.id===g.id);const nt=Object.values(g.games).reduce((a,x)=>a+(x.tours?x.tours.length:0),0);
 return `<div style="border-top:1px solid var(--line);padding:10px 0"><b>${esc(g.name)}</b><div class="note" style="margin:2px 0 8px">${g.friends.length} jugadores · ${nt} torneos</div>
${v.rc===i?`<p class="warn" style="margin-bottom:8px">Se van a reemplazar los datos actuales de este grupo por los de la copia. Antes se descarga una copia de lo actual.</p><div class="row2"><button class="danger" onclick="restoreReplace(${i})">Sí, reemplazar</button><button onclick="go({rc:null})">Cancelar</button></div>`
 :`<div class="row2" style="flex-wrap:wrap">${ex&&isAdminOf(ex)?`<button onclick="go({rc:${i}})">Reemplazar el grupo actual</button>`:''}<button class="${ex?'ghost':'pri'}" onclick="restoreNew(${i})">${ex?'Restaurar como grupo nuevo':'Restaurar como grupo nuevo'}</button></div>`}</div>`}).join(''):''}</div>`}
function profile(){return `<div class="top"><button class="ghost" onclick="go({s:'home',nickErr:'',bk:null,bmsg:'',rc:null})">←</button><h2>Mi perfil</h2></div>
<div class="card"><p class="note" style="margin:0">Tu nick</p><div class="disp" style="font-size:38px;color:var(--acc)">@${esc(ME.nick)}</div></div>
${v.nickErr?`<p class="warn" style="margin-bottom:10px">${esc(v.nickErr)}</p>`:''}
<div class="add"><input class="in" id="nk" placeholder="Nuevo nick" maxlength="16" autocapitalize="off" autocomplete="off" onkeydown="if(event.key==='Enter')saveNick()"><button class="pri" onclick="saveNick()">Cambiar</button></div>
<p class="note">Tus amigos te ven con este nick. Tu mail de Google no se muestra a nadie.</p>${backupCard()}`}
function addMember(u){if(S.friends.some(f=>f.uid===u))return;S.friends.push({id:uid(),name:memberNick(u),uid:u});save();render()}
function linkFriend(id,u){if(!u)return;const f=S.friends.find(x=>x.id===id);if(!f||S.friends.some(x=>x.uid===u))return;f.uid=u;save();render()}
const gData=g=>JSON.stringify({friends:g.friends,games:g.games});
const fromDoc=d=>{let x={};try{x=JSON.parse(d.json||'{}')}catch(e){}return{id:d.id,name:d.name||'Grupo',owner:d.owner,admins:d.admins||[],members:d.members||[],code:d.code||'',friends:x.friends||[],games:x.games||blank().games}};
function saveG(g){FB.saveGroup(g.id,{name:g.name,json:gData(g),updated:Date.now()}).catch(e=>{v.err='No se pudo guardar: '+(e.code||e.message)})}
function save(){if(!USER||!ready||!S||!canEdit())return;const g=S;clearTimeout(tms[g.id]);tms[g.id]=setTimeout(()=>saveG(g),400)}
function saveUser(){if(USER)FB.setUser(USER.uid,{gids:R.groups.map(g=>g.id),cur:R.cur}).catch(()=>{})}
async function createG(name,data){const gid=FB.newId();const b=blank();
  const g={id:gid,name,owner:USER.uid,admins:[],members:[USER.uid],code:'',friends:(data&&data.friends)||(ME?[{id:uid(),name:ME.nick,uid:USER.uid}]:b.friends),games:(data&&data.games)||b.games};
  g.code=await FB.createGroup(gid,{name,owner:USER.uid,admins:[],members:[USER.uid],json:gData(g),updated:Date.now()},USER.uid);
  R.groups.push(g);return g}
function softRender(){if(!S&&(v.s==='game'||v.s==='tour'))v.s='home';const a=document.activeElement;if(a&&a.matches&&a.matches('input,select'))return;render()}
function dropLocal(id){if(subs[id]){subs[id]();delete subs[id]}R.groups=R.groups.filter(g=>g.id!==id)}
async function afterDrop(){if(!R.groups.length){const g=await createG('Mi grupo');R.cur=g.id;watch(g)}setS();saveUser();if(v.s==='game'||v.s==='tour')v.s='home'}
function watch(g){if(subs[g.id])return;subs[g.id]=FB.watch(g.id,s=>{
  if(!s.exists()||s.metadata.hasPendingWrites)return;
  const d=s.data(),x=R.groups.find(q=>q.id===g.id);if(!x)return;let ch=false;
  if(x.name!==d.name){x.name=d.name;ch=true}
  if((d.members||[]).length!==x.members.length){x.members=d.members||[];ch=true;loadProfiles().then(softRender).catch(()=>{})}
  if(d.code&&x.code!==d.code){x.code=d.code;ch=true}
  if(JSON.stringify(d.admins||[])!==JSON.stringify(x.admins||[])){x.admins=d.admins||[];ch=true}
  if(d.json&&d.json!==gData(x)){try{const p=JSON.parse(d.json);x.friends=p.friends||[];x.games=p.games||x.games;normalize();ch=true}catch(e){}}
  if(ch)softRender()},()=>{dropLocal(g.id);afterDrop().then(softRender).catch(()=>{})})}
async function loadAll(){
  ME=await FB.getProfile(USER.uid);PROF={};if(ME)PROF[USER.uid]=ME;
  const ud=await FB.getUser(USER.uid);const gids=(ud&&ud.gids)||[];
  R={groups:[],cur:(ud&&ud.cur)||null};
  for(const id of gids){const d=await FB.getGroup(id);if(d)R.groups.push(fromDoc(d))}
  if(!gids.length&&ud&&ud.json){const old=migrate(JSON.parse(ud.json));for(const og of old.groups)await createG(og.name,{friends:og.friends,games:og.games})}
  if(!R.groups.length){const g=await createG('Mi grupo');R.cur=g.id}
  setS();normalize();await loadProfiles();R.groups.forEach(watch);saveUser();startSocial();
}
window.onUser=async u=>{authChecked=true;USER=u;ready=false;loginErr='';v.menu=false;
  Object.values(subs).forEach(f=>f());subs={};stopSocial();
  if(!u){R={groups:[],cur:null};S=null;ME=null;PROF={};v.s='home';render();return}
  try{await loadAll();ready=true}catch(e){loginErr='No se pudieron cargar tus datos. Revisá las reglas de Firestore y recargá. ('+(e.code||e.message)+')'}
  v.s='home';render()};
function doLogin(){loginErr='';FB.login().catch(e=>{loginErr='No se pudo iniciar sesión: '+(e.code||e.message);render()})}
function doLogout(){FB.logout()}
const loaderView=()=>`<div class="ld"><img src="icon-192.png" alt="" width="112" height="112"><h1 class="logo disp" style="margin:22px 0 14px">Play<b>Stats</b></h1><div class="ldbar"></div><div class="ldp"><span>Calentando los joysticks…</span><span>Contando campeonatos…</span><span>Buscando al rey de la tabla…</span><span>Afilando el cartel rojo…</span></div></div>`;
function loginView(){return `<h1 class="logo disp">Play<b>Stats</b></h1><p class="sub">Iniciá sesión para guardar tus torneos en la nube.</p>${loginErr?`<p class="warn" style="margin-bottom:12px">${esc(loginErr)}</p>`:''}<button class="pri" style="width:100%;min-height:52px;font-size:17px" onclick="doLogin()">Entrar con Google</button>`}
setTimeout(()=>{if(!authChecked){authChecked=true;loginErr='No se pudo conectar con Firebase. Revisá tu conexión y recargá.';render()}},8000);
const score=s=>s.c*3-s.d*2+(s.cp||0)*2;
const sortedPlayers=(G,g)=>G.players.slice().sort((a,b)=>{const x=stat(g,a),y=stat(g,b);return score(y)-score(x)||y.c-x.c||x.d-y.d||y.t-x.t||nm(a).localeCompare(nm(b))});
const balTxt=s=>{const b=score(s);return 'Balance '+(b>0?'+':'')+b+(s.t?' · prom. '+(b/s.t).toFixed(2).replace('.',','):'')};
let v={s:'home',g:null,tab:'table',t:null,draft:{name:'',ps:[]}};
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=id=>{const f=S.friends.find(f=>f.id===id);return f?esc((f.uid&&PROF[f.uid]&&PROF[f.uid].nick)||f.name):'?'};
const stat=(g,p)=>{const o=S.games[g].stats;const x=o[p]||(o[p]={c:0,d:0,t:0,cp:0});if(x.cp===undefined)x.cp=0;return x};
const dTxt=n=>n+(n===1?' descenso':' descensos');
const copTxt=n=>n?' · '+n+(n===1?' copa':' copas'):'';

function rounds(ids){
  const a=ids.slice();if(a.length%2)a.push(null);
  const n=a.length,out=[];
  for(let r=0;r<n-1;r++){
    for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)out.push({r:r+1,a:x,b:y,sa:null,sb:null,pa:null,pb:null,ka:0,kb:0})}
    a.splice(1,0,a.pop());
  }
  return out;
}
function normalize(){for(const gr of R.groups)if(!gr.games.cr)gr.games.cr={players:[],tours:[],stats:{}};
  for(const gr of R.groups)for(const g in gr.games)gr.games[g].tours.forEach(t=>t.matches.forEach(m=>{if(m.pa===undefined){m.pa=null;m.pb=null;m.ka=0;m.kb=0}}))}
function isDone(m,g){return g==='brawl'?(m.pa>0&&m.pb>0&&m.pa!==m.pb):g==='cr'?(m.sa!==null&&m.sb!==null&&m.sa!==m.sb):(m.sa!==null&&m.sb!==null)}
function standings(t,g=v.g){return g==='brawl'?standingsB(t):standingsF(t)}
function standingsB(t){
  const m={};t.players.forEach(p=>m[p]={p,pj:0,g:0,ko:0,pts:0});
  t.matches.forEach(x=>{if(!isDone(x,'brawl'))return;
    [[x.a,x.pa,x.ka],[x.b,x.pb,x.kb]].forEach(([p,pl,k])=>{const r=m[p];r.pj++;r.pts+=5-pl;r.ko+=k;if(pl===1)r.g++});});
  return Object.values(m).sort((a,b)=>b.pts-a.pts||b.ko-a.ko||b.g-a.g);
}
function standingsF(t){
  const m={};t.players.forEach(p=>m[p]={p,pj:0,g:0,e:0,l:0,gf:0,gc:0,pts:0});
  t.matches.forEach(x=>{if(x.sa===null||x.sb===null)return;
    const A=m[x.a],B=m[x.b];A.pj++;B.pj++;A.gf+=x.sa;A.gc+=x.sb;B.gf+=x.sb;B.gc+=x.sa;
    if(x.sa>x.sb){A.g++;A.pts+=3;B.l++}else if(x.sa<x.sb){B.g++;B.pts+=3;A.l++}else{A.e++;B.e++;A.pts++;B.pts++}});
  return Object.values(m).sort((a,b)=>b.pts-a.pts||b.g-a.g);
}

function addFriend(){const i=$('fn');const n=i.value.trim();if(!n)return;
  if(S.friends.some(f=>f.name.toLowerCase()===n.toLowerCase())){i.value='';return}
  S.friends.push({id:uid(),name:n});save();render()}
function delFriend(id){S.friends=S.friends.filter(f=>f.id!==id);
  for(const g in S.games){const G=S.games[g];G.players=G.players.filter(p=>p!==id);delete G.stats[id]}
  save();render()}
function addToTable(){const id=$('sel').value;if(!id)return;const G=S.games[v.g];
  if(!G.players.includes(id)){G.players.push(id);stat(v.g,id)}save();render()}
function rmFromTable(id){const G=S.games[v.g];G.players=G.players.filter(p=>p!==id);save();render()}
function bump(id,k,d){const s=stat(v.g,id);s[k]=Math.max(0,s[k]+d);save();render()}
function addDraft(){const id=$('dsel').value;if(id&&!v.draft.ps.includes(id)){v.draft.ps.push(id);render()}}
function rmDraft(id){v.draft.ps=v.draft.ps.filter(p=>p!==id);render()}
function setMode(m){v.draft.mode=m;render()}
function createT(){const d=v.draft;if(d.ps.length<2)return;const cup=v.g==='fifa'&&d.mode==='copa';
  const G=S.games[v.g];
  const t={id:uid(),name:d.name.trim()||((cup?'Copa ':'Torneo ')+(G.tours.length+1)),players:d.ps.slice(),matches:cup?[]:rounds(d.ps),mode:cup?'copa':'liga',done:false,champ:null};
  G.tours.push(t);d.ps.forEach(p=>{if(!G.players.includes(p))G.players.push(p)});
  v.draft={name:'',ps:[]};save();go({s:'tour',t:t.id})}
function curT(){return S.games[v.g].tours.find(t=>t.id===v.t)}
const stamp=m=>{if(isDone(m,v.g))m.ts=m.ts||Date.now();else delete m.ts};
function setScore(i,side,val){const m=curT().matches[i];
  m[side]=val===''?null:Math.min(v.g==='cr'?3:1e6,Math.max(0,parseInt(val)||0));stamp(m);save();render()}
function koStep(i,k,d){const m=curT().matches[i];setB(i,k,Math.max(0,(m[k]||0)+d))}
function setB(i,k,val){const m=curT().matches[i];
  if(k==='pa'||k==='pb')m[k]=val===''?null:parseInt(val);else m[k]=Math.max(0,parseInt(val)||0);
  stamp(m);save();render()}
function finishT(){const t=curT(),G=S.games[v.g];const st=standings(t);
  t.done=true;t.champ=st[0].p;t.ts=Date.now();
  st.forEach(r=>stat(v.g,r.p).t++);stat(v.g,st[0].p).c++;stat(v.g,st[st.length-1].p).d++;
  save();render()}
function throne(n,l,sub){return `<div class="throne"><div class="cr">👑</div><div class="tl">${l}</div><div class="tn">${n}</div><div class="ts">${sub}</div></div>`}
function shame(n,l,sub){return `<div class="zocalo"><span class="zt">${l}</span><b>${n}</b><span>${sub}</span></div>`}
function worstIx(a){const i=a.length-1;return a.length>1&&a[i].d>0?i:-1}
function worstG(G,g){const sp=sortedPlayers(G,g);const i=worstIx(sp.map(p=>stat(g,p)));return i>=0?sp[i]:null}
const rk=(ix,ok,bad)=>bad?'<span class="crown">🔻</span>':ix===0&&ok?'<span class="crown">👑</span>':'<span class="rk">'+(ix+1)+'</span>';
function throneG(){const G=S.games[v.g];const p=sortedPlayers(G,v.g)[0];if(!p)return'';const s=stat(v.g,p);if(score(s)<=0)return'';
  return throne(nm(p),'El rey de '+GAMES[v.g].n,s.c+(s.c===1?' campeonato':' campeonatos')+copTxt(s.cp)+' · '+dTxt(s.d)+'<br>Vení, bajame si podés')}
function delT2(rev){const t=curT(),G=S.games[v.g];
  if(rev&&t.done&&t.mode==='copa'){t.players.forEach(p=>{const x=stat(v.g,p);x.t=Math.max(0,x.t-1)});const a=stat(v.g,t.champ);a.cp=Math.max(0,a.cp-1);if(t.desc){const b=stat(v.g,t.desc);b.d=Math.max(0,b.d-1)}}
  else if(rev&&t.done){const st=standings(t);st.forEach(r=>{const s=stat(v.g,r.p);s.t=Math.max(0,s.t-1)});
    const a=stat(v.g,t.champ||st[0].p),b=stat(v.g,st[st.length-1].p);a.c=Math.max(0,a.c-1);b.d=Math.max(0,b.d-1)}
  G.tours=G.tours.filter(x=>x.id!==v.t);save();go({s:'game',tab:'tours',cd:false})}

async function delGroup(id){const g=R.groups.find(x=>x.id===id);if(!g)return;v.dg=null;v.err='';
  try{if(subs[id]){subs[id]();delete subs[id]}
    if(g.owner===USER.uid)await FB.deleteGroup(id,g.code);else await FB.leave(id,USER.uid,(g.admins||[]).includes(USER.uid));
    R.groups=R.groups.filter(x=>x.id!==id);
    if(!R.groups.length){const ng=await createG('Mi grupo');R.cur=ng.id;watch(ng)}
    setS();saveUser();render()}catch(e){v.err='No se pudo completar: '+(e.code||e.message);watch(g);render()}}
async function doJoin(){const c=$('jc').value.trim().toUpperCase();if(!c)return;v.err='';v.msg='';

    if(R.groups.some(g=>g.id===gid)){v.err='Ya estás en ese grupo.';render();return}
    const d=await FB.getGroup(gid);if(!d)throw new Error('x');
    const g=fromDoc(d);R.groups.push(g);R.cur=gid;setS();normalize();await loadProfiles();watch(g);saveUser();go({s:'home',g:null})

function calcTitles(){
  const P={};
  S.friends.forEach(f=>{P[f.id]={id:f.id,c:0,cp:0,d:0,t:0,fifa:{pj:0,w:0,e:0,l:0,gf:0,gc:0,big:0},cr:{pj:0,w:0,l:0,gf:0,gc:0,triple:0},brawl:{pj:0,first:0,last:0,ko:0,pos:0},tg:{fifa:0,brawl:0,cr:0},sw:0,sl:0,second:0,dyn:0,loss:0,vs:{},trophies:[]}});
  for(const gm of GM){const G=S.games[gm];if(!G)continue;
    for(const id in G.stats){const p=P[id],x=G.stats[id];if(p){p.c+=x.c||0;p.cp+=x.cp||0;p.d+=x.d||0;p.t+=x.t||0;p.tg[gm]+=x.t||0}}
    const ev=[];let k=0;
    G.tours.forEach(t=>t.matches.forEach(m=>{if(isDone(m,gm))ev.push({m,k:k++})}));
    ev.sort((a,b)=>(a.m.ts||0)-(b.m.ts||0)||a.k-b.k);
    const seq={};
    ev.forEach(({m})=>{const A=P[m.a],B=P[m.b];if(!A||!B)return;let ra,rb;
      if(gm==='brawl'){ra=m.pa<m.pb?'W':'L';rb=ra==='W'?'L':'W';
        A.brawl.pj++;B.brawl.pj++;A.brawl.ko+=m.ka||0;B.brawl.ko+=m.kb||0;A.brawl.pos+=m.pa;B.brawl.pos+=m.pb;
        if(m.pa===1)A.brawl.first++;if(m.pb===1)B.brawl.first++;if(m.pa===4)A.brawl.last++;if(m.pb===4)B.brawl.last++}
      else{ra=m.sa>m.sb?'W':m.sa<m.sb?'L':'D';rb=ra==='W'?'L':ra==='L'?'W':'D';
        const X=gm==='fifa'?[A.fifa,B.fifa]:[A.cr,B.cr];
        X[0].pj++;X[1].pj++;X[0].gf+=m.sa;X[0].gc+=m.sb;X[1].gf+=m.sb;X[1].gc+=m.sa;
        if(ra==='W'){X[0].w++;X[1].l++;if(gm==='fifa')X[0].big=Math.max(X[0].big,m.sa-m.sb);else if(m.sa===3&&m.sb===0)X[0].triple++}
        else if(ra==='L'){X[1].w++;X[0].l++;if(gm==='fifa')X[1].big=Math.max(X[1].big,m.sb-m.sa);else if(m.sb===3&&m.sa===0)X[1].triple++}
        else if(gm==='fifa'){X[0].e++;X[1].e++}}
      if(ra==='L')A.loss++;if(rb==='L')B.loss++;
      const v1=A.vs[B.id]||(A.vs[B.id]={w:0,l:0}),v2=B.vs[A.id]||(B.vs[A.id]={w:0,l:0});
      if(ra==='W'){v1.w++;v2.l++}else if(ra==='L'){v1.l++;v2.w++}
      (seq[A.id]=seq[A.id]||[]).push(ra);(seq[B.id]=seq[B.id]||[]).push(rb)});
    for(const id in seq){let w=0,l=0;seq[id].forEach(r=>{w=r==='W'?w+1:0;l=r==='L'?l+1:0;P[id].sw=Math.max(P[id].sw,w);P[id].sl=Math.max(P[id].sl,l)})}
    const dn=G.tours.map((t,i)=>({t,i})).filter(x=>x.t.done&&x.t.champ).sort((a,b)=>(tourTs(a.t)-tourTs(b.t))||a.i-b.i);
    let last=null,run=0;
    dn.forEach(({t})=>{const cup=t.mode==='copa';
      if(P[t.champ])P[t.champ].trophies.push({gm,type:cup?'copa':'liga',name:t.name,ts:tourTs(t)});
      let sec=null;if(cup)sec=t.runner;else{const st=standings(t,gm);if(st.length>1)sec=st[1].p}
      if(sec&&P[sec])P[sec].second++;
      run=t.champ===last?run+1:1;last=t.champ;if(P[t.champ])P[t.champ].dyn=Math.max(P[t.champ].dyn,run)})}
  const G3={fifa:0,brawl:0,cr:0};for(const gm of GM)if(S.games[gm])G3[gm]=S.games[gm].tours.filter(t=>t.done).length;G3.all=G3.fifa+G3.brawl+G3.cr;
  const aw={},by={};
  if(S.friends.length>=2)TITLES.forEach(T=>{
    if(G3[T.gm||'all']<(T.mt||1))return;
    const el=[];S.friends.forEach(f=>{const x=T.v(P[f.id]);if(x!=null&&isFinite(x))el.push([f.id,Math.round(x*1e4)/1e4])});
    if(!el.length)return;const mn=T.best==='min';
    const best=mn?Math.min(...el.map(e=>e[1])):Math.max(...el.map(e=>e[1]));
    if(!mn&&best<(T.min||1))return;
    const hs=el.filter(e=>e[1]===best).map(e=>e[0]);
    if(el.length>1&&hs.length===el.length)return;
    if(el.length<2&&mn)return;
    let name=T.n;if(T.tiers)T.tiers.th.forEach((th,i)=>{if(best>=th)name=T.tiers.n[i]});
    aw[T.id]={t:T,holders:hs,value:best,name};hs.forEach(id=>(by[id]=by[id]||[]).push(aw[T.id]))});
  return{P,aw,by,gates:G3}}

function render(reset){

  if(!reset)document.querySelectorAll('.wrap,.vsw').forEach((e,i)=>{if(sl[i])e.scrollLeft=sl[i]});

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,onSnapshot,arrayUnion,arrayRemove,writeBatch,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAGXNLFqr5lJG64dVf1twqU0CuUb_lK1nA",
  authDomain: "playstats-44b04.firebaseapp.com",
  projectId: "playstats-44b04",
  storageBucket: "playstats-44b04.firebasestorage.app",
  messagingSenderId: "359440420654",
  appId: "1:359440420654:web:0fd892b22e2439282c74bf",
  measurementId: "G-BEKNLS6YC0"
};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const fs=getFirestore(app);
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)];return c};
window.FB={
  login:()=>signInWithPopup(auth,new GoogleAuthProvider()),
  logout:()=>signOut(auth),
  getProfile:async uid=>{const s=await getDoc(doc(fs,'profiles',uid));return s.exists()?s.data():null},
  nickFree:async nl=>!(await getDoc(doc(fs,'nicks',nl))).exists(),
  setNick:async(uid,nick,old)=>{const nl=nick.toLowerCase();const b=writeBatch(fs);
    if(old!==nl){if(old)b.delete(doc(fs,'nicks',old));b.set(doc(fs,'nicks',nl),{uid})}
    b.set(doc(fs,'profiles',uid),{nick,nickLower:nl,updated:Date.now()});await b.commit()},
  nickUid:async nl=>{const s=await getDoc(doc(fs,'nicks',nl));return s.exists()?s.data().uid:null},
  watchFr:(uid,cb)=>onSnapshot(query(collection(fs,'friendships'),where('users','array-contains',uid)),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{}),
  watchInv:(uid,cb)=>onSnapshot(query(collection(fs,'invites'),where('to','==',uid)),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{}),
  sendReq:(me,other)=>{const u=[me,other].sort();return setDoc(doc(fs,'friendships',u.join('_')),{users:u,from:me,to:other,status:'pending'})},
  acceptReq:id=>updateDoc(doc(fs,'friendships',id),{status:'accepted'}),
  delReq:id=>deleteDoc(doc(fs,'friendships',id)),
  sendInvite:(gid,gname,from,fromNick,to)=>setDoc(doc(fs,'invites',gid+'_'+to),{gid,gname,from,fromNick,to}),
  delInvite:id=>deleteDoc(doc(fs,'invites',id)),
  joinGroup:(gid,uid)=>updateDoc(doc(fs,'groups',gid),{members:arrayUnion(uid)}),
  getUser:async uid=>{const s=await getDoc(doc(fs,'users',uid));return s.exists()?s.data():null},
  setUser:(uid,d)=>setDoc(doc(fs,'users',uid),d,{merge:true}),
  newId:()=>doc(collection(fs,'groups')).id,
  getGroup:async gid=>{try{const s=await getDoc(doc(fs,'groups',gid));return s.exists()?{id:s.id,...s.data()}:null}catch(e){if(e.code==='permission-denied')return null;throw e}},
  createGroup:async(gid,data,uid)=>{let code=genCode();await setDoc(doc(fs,'groups',gid),{...data,code});
    for(let i=0;i<8;i++){try{await setDoc(doc(fs,'codes',code),{gid,owner:uid});break}catch(e){code=genCode();await updateDoc(doc(fs,'groups',gid),{code})}}
    return code},
  saveGroup:(gid,d)=>updateDoc(doc(fs,'groups',gid),d),
  deleteGroup:async(gid,code)=>{await deleteDoc(doc(fs,'groups',gid));try{await deleteDoc(doc(fs,'codes',code))}catch(e){}},
  join:async(code,uid)=>{const c=await getDoc(doc(fs,'codes',code));if(!c.exists())throw new Error('code');const gid=c.data().gid;await updateDoc(doc(fs,'groups',gid),{members:arrayUnion(uid)});return gid},
  leave:(gid,uid,wasAdmin)=>updateDoc(doc(fs,'groups',gid),wasAdmin?{members:arrayRemove(uid),admins:arrayRemove(uid)}:{members:arrayRemove(uid)}),
  setAdmins:(gid,list)=>updateDoc(doc(fs,'groups',gid),{admins:list}),
  watch:(gid,cb,err)=>onSnapshot(doc(fs,'groups',gid),cb,err)
};
onAuthStateChanged(auth,u=>window.onUser&&window.onUser(u));
</script>
